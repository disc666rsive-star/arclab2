
events {}

http {
    server {
        listen 80;

        location /users {
            proxy_pass http://users:5001;
        }

        location /products {
            proxy_pass http://products:5002;
        }

        location /all {
            proxy_pass http://main:5000;
        }

        location / {
            proxy_pass http://main:5000;
        }
    }
}
