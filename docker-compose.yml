
services:
  users:
    build: ./service_users
    ports:
      - "5001:5001"

  products:
    build: ./service_products
    ports:
      - "5002:5002"

  main:
    build: ./main_app
    ports:
      - "5000:5000"
    environment:
      USERS_URL: http://users:5001
      PRODUCTS_URL: http://products:5002
    depends_on:
      - users
      - products

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main
      - users
      - products
